name: brightspeed_fiber_app
description: TechMate field service app with clean architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_bloc: ^9.1.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  equatable: ^2.0.7
  intl: ^0.19.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  permission_handler: ^12.0.3
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  audioplayers: ^6.5.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/local_json/jobs.json
    - assets/local_json/featureflag_config.json
    - assets/sounds/pending_sound.mp3
    - assets/sounds/assigned_sound.mp3
    - assets/sounds/completed_sound.mp3
    - assets/sounds/wifi_installation_sound.mp3
    - assets/branding/techmate_icon_1024.png
